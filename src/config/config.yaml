  - name: SAPO Notícias
    topics: [Portugal, Portugal economy]
    rss_url: https://www.sapo.pt/rss
  - name: ECO SAPO Notícias
    topics: [Portugal, Portugal economy]
    rss_url: https://eco.sapo.pt/feed/
  - name: Jornal Económico
    topics: [Portugal, Portugal economy]
    rss_url: https://jornaleconomico.sapo.pt/feed/
  - name: Público
    topics: [Portugal, Portugal economy]
    rss_url: https://feeds.feedburner.com/PublicoRSS

  # Algarve-only regional sources (ranking_mode: latest — no place-name filter).
  - name: Jornal do Algarve
    topics: [Algarve]
    rss_url: https://jornaldoalgarve.pt/feed/
  - name: Região Sul
    topics: [Algarve]
    rss_url: https://regiao-sul.pt/feed/
